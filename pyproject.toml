[project]
name = "omalaka"
version = "0.1.0"
description = "Fine-tuning open translation models for Namibian languages (Oshikwanyama and Oshindonga to English first)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11",
    "transformers>=5.21",
    "peft>=0.21",
    "accelerate>=1.15",
    "sacrebleu>=2.6",
    "sentencepiece>=0.2",
    "safetensors>=0.8",
    "huggingface-hub>=2.3",
]

[project.optional-dependencies]
# Only for experiments/prepare_mt560.py, which reads a local, non-open corpus.
experiments = ["pandas>=3.1", "pyarrow>=26"]

[project.scripts]
omalaka-download = "omalaka.download:main"
omalaka-synthetic = "omalaka.datasets.synthetic_madlad:main"
omalaka-prepare = "omalaka.prepare:main"
omalaka-train = "omalaka.train:main"
omalaka-evaluate = "omalaka.evaluate:main"

[project.urls]
Repository = "https://github.com/gijzelaerr/omalaka"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

# CUDA 12.8 wheels on Windows and Linux; macOS gets the default PyPI build.
# For a CPU-only Linux machine, swap the index for https://download.pytorch.org/whl/cpu.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
